# own Compose project name, so Docker never mixes this lecture's container up with other
# containers of the 'spring-7-rest-mvc' project (the default name is the folder name)
name: 'spring-7-rest-mvc-jt-sb411-sec22-assn25'

services:
  mysql:
    container_name: 'mysql-spring7-rest-sec22-assn25'
    image: 'mysql:9.5'
    environment:
      - 'MYSQL_DATABASE=jt_spring7_rest_sec22_assn25_db'
      # username and passwords live in the .env file next to this one, which is not in Git
      # (see .env.example); ':?' makes Compose fail with that message instead of starting MySQL
      # without a password
      - 'MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the .env file}'
      - 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the .env file}'
      - 'MYSQL_USER=${MYSQL_USER:?set MYSQL_USER in the .env file}'
    ports:
      # host port 3308 -> container port 3306
      - '3308:3306'
    volumes:
      # named volume for the data directory. The localmysql profile only stops the container on
      # shutdown ('docker compose stop'), so the data survives and the next start reuses it. The
      # explicit name makes the volume easy to inspect or remove ('docker compose down -v'), instead
      # of an anonymous hash nothing points to.
      - 'mysql-spring7-rest-sec22-assn25-data:/var/lib/mysql'

volumes:
  mysql-spring7-rest-sec22-assn25-data:
    # without this, Compose would prefix the project name: 'spring-7-rest-mvc-jt-sb411-sec22-assn25_mysql-...'
    name: 'mysql-spring7-rest-sec22-assn25-data'
