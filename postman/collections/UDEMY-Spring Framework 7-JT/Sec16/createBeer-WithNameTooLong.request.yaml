$kind: 'http-request'
name: 'createBeer-WithNameTooLong'
order: 3000
method: 'POST'
url: 'localhost:8080/api/v1/beer'
body:
  type: 'json'
  content: |-
    {
      "beerName": "My Beer 0123345678901233456789012334567890123345678901233456789012334567890123345678901233456789",
      "beerStyle": "PALE_ALE",
      "upc": "234234234234",
      "price": "11.99"
    }
scripts:
  - type: 'afterResponse'
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Body matches the error string", function () {
          pm.expect(pm.response.text()).to.include("Beer's Name length must be maximal 50");
      });
    language: 'text/javascript'
