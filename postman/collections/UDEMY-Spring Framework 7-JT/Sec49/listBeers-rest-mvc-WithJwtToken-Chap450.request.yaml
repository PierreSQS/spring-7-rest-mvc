$kind: 'http-request'
name: 'listBeers-rest-mvc-WithJwtToken-Chap450'
order: 1000
method: 'GET'
url: 'localhost:8080/api/v1/beer'
auth:
  type: 'oauth2'
  credentials:
    - key: 'clientId'
      value: '{{messagingClientId}}'
    - key: 'accessTokenUrl'
      value: 'http://localhost:8080/oauth2/token'
    - key: 'tokenName'
      value: 'cliencredential JT docker compose'
    - key: 'addTokenTo'
      value: 'header'
    - key: 'clientSecret'
      value: '{{clientSecret}}'
    - key: 'scope'
      value: 'message.read message.write'
    - key: 'client_authentication'
      value: 'header'
    - key: 'grant_type'
      value: 'client_credentials'
