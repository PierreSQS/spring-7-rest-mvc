$kind: 'http-request'
name: 'Chap245_Get-Token_ClientCredentials'
order: 4000
method: 'GET'
url: ''
description: |-
  ``` markdown
  Prerequisites

  Course: John Thompson, Spring Framework 7 (Udemy), Section 23, Lecture 245.
  IntelliJ project: spring-7-auth-server (C:\Pierrot\05_Git_Repositories\Udemy\JohnThomson\spring-7-auth-server).
  GitHub: PierreSQS/spring-7-auth-server-jt, branch 8-package-refactor-sb411 (Spring Boot 4.1.1).
  Authorization server running on port 9000 (./mvnw spring-boot:run or IntelliJ).
  Client: oidc-client / {{clientSecret}} (see SecurityConfig.java).
  Goal: get an access token for the application itself (no user involved).

  Flow: Client Credentials.

  Steps

  Authorization → Get New Access Token.
  Expected result: an access token with sub = oidc-client and scope message.read. No refresh token, no ID token.

  Note: this token can't call /userinfo (no user, no openid scope).

   ```
auth:
  type: 'oauth2'
  credentials:
    - key: 'clientId'
      value: '{{oidcClientId}}'
    - key: 'accessTokenUrl'
      value: 'http://localhost:9000/oauth2/token'
    - key: 'tokenName'
      value: 'Sec23-Chap245-ClientCredentials'
    - key: 'addTokenTo'
      value: 'header'
    - key: 'clientSecret'
      value: '{{clientSecret}}'
    - key: 'scope'
      value: 'message.read'
    - key: 'grant_type'
      value: 'client_credentials'
