$kind: 'http-request'
name: 'Get Beers with JWT-Token-messaging-client'
order: 2000
method: 'GET'
url: 'localhost:8080/api/v1/beer'
auth:
  type: 'oauth2'
  credentials:
    - key: 'clientId'
      value: '{{messagingClientId}}'
    - key: 'headerPrefix'
      value: 'Bearer'
    - key: 'accessTokenUrl'
      value: 'http://localhost:9000/oauth2/token'
    - key: 'authUrl'
      value: 'http://localhost:8080/oauth2/authorize'
    - key: 'tokenName'
      value: 'Sec23-Chap245'
    - key: 'addTokenTo'
      value: 'header'
    - key: 'clientSecret'
      value: '{{clientSecret}}'
    - key: 'scope'
      value: 'message.read message.write'
    - key: 'state'
      value: ''
    - key: 'client_authentication'
      value: 'header'
    - key: 'redirect_uri'
      value: ''
    - key: 'grant_type'
      value: 'client_credentials'
    - key: 'useBrowser'
      value: true
