$kind: 'http-request'
name: 'listBeers-rest-mvc-WithJwtToken-Assn53-K8s-Pierrot'
order: 1000
method: 'GET'
url: 'localhost:8080/api/v1/beer'
auth:
  type: 'oauth2'
  credentials:
    - key: 'clientId'
      value: '{{messagingClientId}}'
    - key: 'accessTokenUrl'
      value: 'http://localhost:8080/oauth2/token'
    - key: 'tokenName'
      value: 'cliencredential JT K8s'
    - key: 'addTokenTo'
      value: 'header'
    - key: 'clientSecret'
      value: '{{clientSecret}}'
    - key: 'scope'
      value: 'message.read message.write'
    - key: 'client_authentication'
      value: 'header'
    - key: 'grant_type'
      value: 'client_credentials'
scripts:
  - type: 'afterResponse'
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("TotalElements is 2413", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.totalElements).to.eql(2413);
      });
    language: 'text/javascript'
