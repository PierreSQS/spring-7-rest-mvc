$kind: 'http-request'
name: 'Chap227-listBeersHttpBasic'
order: 3000
method: 'GET'
url: 'localhost:8080/api/v1/beer'
auth:
  type: 'basic'
  credentials:
    - key: 'username'
      value: '{{basicUsername2}}'
    - key: 'password'
      value: '{{basicUsername2}}'
scripts:
  - type: 'afterResponse'
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Total Elements are 2413", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.totalElements).to.eql(2413);
      });

    language: 'text/javascript'
