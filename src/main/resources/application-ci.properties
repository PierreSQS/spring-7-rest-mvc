# issuer of the JWTs for the 'ci' profile. The value below is a placeholder (the name jwt-uri between two at signs):
# Maven resource filtering replaces it at build with the <jwt-uri> property of pom.xml, so the jar holds the real value.
# Do not write the placeholder in a comment: Maven replaces it there too.
spring.security.oauth2.resourceserver.jwt.issuer-uri=@jwt-uri@
