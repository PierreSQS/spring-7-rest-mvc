
logging.level.guru.springframework=debug

spring.flyway.enabled=false

# fixed Spring Security user instead of a generated password at each start;
# the password is read from .env (gitignored, see .env.example) or from an environment variable
spring.config.import=optional:file:.env[.properties]
spring.security.user.name=user
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

spring.docker.compose.enabled=false

