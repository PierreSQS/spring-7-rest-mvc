# enable colorized logging in the console
spring.output.ansi.enabled=always

logging.level.guru.springframework=debug

# Spring Security trace logs every filter a request passes through (handy to debug a 401/403), but also
# request details such as the Bearer token: only enable it locally, in config/application.properties
#logging.level.org.springframework.security=trace

spring.flyway.enabled=false

# H2 web console at http://localhost:8080/h2-console. Since Boot 4 it needs the spring-boot-h2console
# dependency, which this pom does not have, and the security chain would block it as well
#spring.h2.console.enabled=true

# Docker Compose support is on by default once spring-boot-docker-compose is on the classpath;
# the default (H2) profile must not start the MySQL container from compose.yaml
spring.docker.compose.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=drop-and-create.sql
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=drop-and-create.sql

# debugging only: logs "Began transaction" / "Rolled back transaction" around each @Transactional test
# (Spring 7 logs them at DEBUG). Enable it locally, in config/application.properties
#logging.level.org.springframework.test.context.transaction=debug
