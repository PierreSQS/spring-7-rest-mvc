
logging.level.guru.springframework=debug
spring.flyway.enabled=false

# no lazy associations in this model, so the persistence session can close with the service call
spring.jpa.open-in-view=false

# Docker Compose support is on by default once spring-boot-docker-compose is on the classpath;
# the default (H2) profile must not start the MySQL container from compose.yaml
spring.docker.compose.enabled=false

