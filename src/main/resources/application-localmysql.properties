server.port=8081

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# not redundant: without it devtools takes MySQL for an in-memory H2 and sends it SHUTDOWN on stop (#16)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# starts the MySQL service from compose.yaml and runs the application against it; must be set here
# explicitly, because application.properties switches Docker Compose off for all other profiles.
# Compose also supplies url, user and password, so this profile declares no spring.datasource.url,
# username or password of its own.
spring.docker.compose.enabled=true

# on shutdown, only stop the container ('docker compose stop'): the container and its data volume
# survive, so the next start reuses the same database. Flyway then checks its migrations against the
# existing schema ("Schema ... is up to date") instead of building a fresh one - see R25 in
# docs/regles-a-retenir.md. To start again from an empty database, run 'docker compose down -v' by hand.
# 'stop' is Boot's default; it is written out so the choice is visible.
spring.docker.compose.stop.command=stop

spring.datasource.hikari.pool-name=RestDB-Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

