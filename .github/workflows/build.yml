# Build and test on every push (except pushes that change only documentation).
# A green check on a commit = the whole test suite passed on GitHub.
# Used to decide that an issue is fixed (pushed + green + "Done when" met).

name: Build and test

on:
  push:                # every push, on every branch that contains this file...
    paths-ignore:      # ...except a push that changes ONLY these files
      - 'docs/**'      # the docs folder
      - '**/*.md'      # any Markdown file (README, ...)
  workflow_dispatch:   # "Run workflow" button on GitHub, to rerun by hand (also for docs-only pushes)

jobs:
  build:
    runs-on: ubuntu-latest   # Linux machine from GitHub, with Docker (needed by MySqlIT / Testcontainers)

    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven        # keeps the downloaded jars between runs

      - name: Unit tests + integration tests
        run: ./mvnw -B verify   # surefire (*Test), then failsafe (*IT); -B = batch mode, plain log

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
